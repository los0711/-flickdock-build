name: Native clipboard history

on:
  push:
    branches: [feature-local-clipboard-history]

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'los0711/-flickdock-build'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install native test requirements
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          if [[ "$RUNNER_OS" == macOS ]]; then python -m pip install 'pyobjc-framework-Quartz>=11,<13'; fi
      - name: Verify history cards, storage and independent clipboard settings
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest test_local_clipboard_history test_clipboard_sync_v1819 test_architecture -q
      - name: Insert native history into a separate application
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: python ci_clipboard_history_native.py driver "$RUNNER_TEMP/history-native-test"
