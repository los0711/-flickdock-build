name: Diagnose source and frozen Mac media environment
on:
  push:
    branches: [mac-video-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: 418615af948102f2172631ea7ffddbc5e346827e
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14165688007'
          run-id: '43722092773'
          github-token: ${{ github.token }}
          path: ci-built
      - name: Install and check all verification dependencies
        run: |
          python -m pip install 'PySide6==6.12.0' 'pyobjc-framework-Quartz>=11,<13' 'keyring==25.7.0' 'fasttext-predict-v2==1.1.0' 'yt-dlp[default]==2026.10.26' 'imageio-ffmpeg==0.6.0' 'cryptography==50.0.2'
          python -c "import imageio_ffmpeg; from pathlib import Path; p=Path(imageio_ffmpeg.get_ffmpeg_exe()); assert p.is_file(); print('Generated-video fixture dependency is ready')"
      - name: Compare source and frozen media with audio and silent fixtures
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys,tempfile,zipfile
          from pathlib import Path
          import imageio_ffmpeg
          from mac_updates import _extract
          output=Path('reverification');output.mkdir(exist_ok=True)
          built=Path('ci-built')
          candidates=list(built.rglob('mac-build-1.8.37-arm64.json'))
          assert len(candidates)==1,candidates
          built=candidates[0].parent
          build=json.loads(candidates[0].read_text())
          assert build['ok'] and build['architecture']=='arm64' and build['version']=='1.8.37'
          expected={'zip':'5578e4f644fc8a196359a5e180cc66c42ba9cba766cc9890ed180e3e96ab1650',
                    'dmg':'6c3b254e0f0cd212b64288d4dacf5d0b576dcd2b67d6c2d6eba8a967e9c943cf',
                    'pkg':'ee21f984563f76b545071b4a67cb691e399929b0fc09ed497b4412eea4411a1e'}
          for row in build['artifacts']:
              path=built/row['name']
              with path.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
              assert path.stat().st_size==row['bytes'] and digest==row['sha256']==expected[path.suffix[1:]]
          with zipfile.ZipFile(built/'FlickDock-1.8.37-macOS-arm64.zip') as archive:
              app=_extract(archive,Path('ci-app'),None)
          subprocess.run(['/usr/bin/codesign','--verify','--deep','--strict',str(app)],check=True,timeout=30)
          with tempfile.TemporaryDirectory(prefix='flickdock-media-ab-') as profile:
              cases=[]
              for audio in (True,False):
                  video=Path(profile)/('audio.mp4' if audio else 'silent.mp4')
                  command=[imageio_ffmpeg.get_ffmpeg_exe(),'-v','error','-f','lavfi','-i','testsrc=size=640x360:rate=24']
                  if audio:command+=['-f','lavfi','-i','sine=frequency=440:sample_rate=44100']
                  command+=['-t','4','-c:v','libx264','-pix_fmt','yuv420p']
                  if audio:command+=['-c:a','aac','-shortest']
                  command+=['-y',str(video)]
                  subprocess.run(command,check=True,capture_output=True,timeout=30)
                  for frozen in (False,True):
                      name=('frozen' if frozen else 'source')+('-audio' if audio else '-silent')
                      report=(output/(name+'.json')).resolve()
                      command=([str((app/'Contents/MacOS/FlickDock').resolve())] if frozen else [sys.executable,'flickdock.py'])
                      command+=['--verify-media',str(video),'--verify-output',str(report)]
                      env=dict(os.environ,HOME=profile,APPDATA=profile,XDG_CONFIG_HOME=profile,
                               QT_QPA_PLATFORM='offscreen',QT_MEDIA_BACKEND='darwin',
                               QT_LOGGING_RULES='qt.multimedia.*=true')
                      result=subprocess.run(command,env=env,capture_output=True,text=True,timeout=45)
                      (output/(name+'.log')).write_text(result.stdout+'\n'+result.stderr)
                      value=json.loads(report.read_text()) if report.exists() else {}
                      row=dict(case=name,exit_code=result.returncode,report=value)
                      cases.append(row);print(json.dumps(row),flush=True)
              (output/'media-environment-ab.json').write_text(json.dumps(dict(cases=cases,scope='Compare AVFoundation offscreen support, not installed-app acceptance'),indent=2))
          PY
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Mac-media-environment-${{ github.sha }}
          path: reverification/
          if-no-files-found: warn
          retention-days: 3
