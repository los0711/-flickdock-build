name: macOS supervised video-compositor comparison
on:
  push:
    branches: [mac-video-diagnostics]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        renderer: [legacy, composited]
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install isolated test dependencies
        run: python -m pip install 'PySide6==6.12.0' 'pyobjc-framework-Quartz>=11,<13' 'keyring==25.7.0' 'fasttext-predict-v2==1.1.0' 'yt-dlp[default]==2026.10.26' 'imageio-ffmpeg==0.6.0' 'cryptography==50.0.2'
      - name: Test playback, selection and morph using an external supervisor
        timeout-minutes: 8
        run: |
          failed=0
          for attempt in 1 2 3; do
            python ci_mac_video_compositor.py --source "$PWD" --renderer '${{ matrix.renderer }}' --clicks 50 --timeout 120 --output "ci-mac-video-probe/${{ matrix.renderer }}/$attempt" || failed=$((failed+1))
          done
          test "$failed" -eq 0
      - name: Retain macOS native crash reports
        if: always()
        run: |
          mkdir -p ci-mac-video-probe/native-reports
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -iname '*python*.ips' -o -iname '*python*.crash' \) -mmin -30 -exec cp -n {} ci-mac-video-probe/native-reports/ \;
          fi
      - name: Retain comparison data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-video-compositor-${{ github.sha }}-${{ matrix.renderer }}
          path: ci-mac-video-probe/
          if-no-files-found: warn
          retention-days: 3
