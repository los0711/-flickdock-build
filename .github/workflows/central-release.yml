name: Central release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check the signing key, verify all credentials, or publish a new version
        type: choice
        required: true
        default: verify
        options: [signing-test, verify, publish]
      target:
        description: Publish both platforms, only Apple Silicon, or complete an Apple Silicon release with Windows x64
        type: choice
        required: true
        default: both
        options: [both, mac-arm64, windows-x64]
      notes:
        description: Concise user-facing release notes (required for publish)
        type: string
        required: false

permissions:
  contents: read

env:
  FLICKDOCK_RELEASE_TARGET: ${{ inputs.target }}

concurrency:
  group: flickdock-central-release
  cancel-in-progress: false

jobs:
  authorization:
    if: github.repository == 'los0711/-flickdock-build' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.target != 'both' && 'ubuntu-24.04' || 'windows-2025' }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 10
    environment: flickdock-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install release verification dependencies
        run: python -m pip install PySide6==6.12.0 cryptography==50.0.2 requests==2.34.2
      - name: Verify the signing identity and private source access
        if: inputs.mode == 'signing-test'
        env:
          FLICKDOCK_RELEASE_SIGNING_KEY: ${{ secrets.FLICKDOCK_RELEASE_SIGNING_KEY }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: python release_pipeline.py verify-gitee
      - name: Verify publishing credentials
        if: inputs.mode != 'signing-test'
        env:
          FLICKDOCK_RELEASE_SIGNING_KEY: ${{ secrets.FLICKDOCK_RELEASE_SIGNING_KEY }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python release_pipeline.py verify-credentials
      - name: Verify version, source and currently published update indices
        if: inputs.mode == 'publish'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          FLICKDOCK_RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          python release_pipeline.py preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python release_source_sync.py --verify-baseline

  windows:
    if: inputs.mode == 'publish' && inputs.target != 'mac-arm64'
    needs: authorization
    uses: ./.github/workflows/release-windows.yml
    permissions:
      contents: read

  macos:
    if: inputs.mode == 'publish' && inputs.target != 'windows-x64' && github.repository == 'los0711/-flickdock-build' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/macos-build.yml
    with:
      test_build: true
      desktop_checks: ${{ inputs.target == 'mac-arm64' }}
    permissions:
      contents: read

  publish:
    if: >-
      always() && inputs.mode == 'publish' && needs.authorization.result == 'success' &&
      (needs.macos.result == 'success' || (inputs.target == 'windows-x64' && needs.macos.result == 'skipped')) &&
      (needs.windows.result == 'success' || (inputs.target == 'mac-arm64' && needs.windows.result == 'skipped'))
    needs: [authorization, windows, macos]
    runs-on: ${{ inputs.target == 'mac-arm64' && 'ubuntu-24.04' || 'windows-2025' }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 90
    environment: flickdock-release
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install release tools before loading credentials
        run: |
          python -m pip install -r requirements.txt requests==2.34.2
          npm ci --prefix website --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.target != 'mac-arm64'
        with:
          name: FlickDock-Windows-x64-${{ github.sha }}
          path: ci-windows-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.target != 'windows-x64'
        with:
          name: FlickDock-macOS-arm64-${{ github.sha }}
          path: ci-macos-release
      - name: Archive and stage verified packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLICKDOCK_RELEASE_NOTES: ${{ inputs.notes }}
        run: python release_pipeline.py stage
      - name: Check the staged download gateway
        run: node website/test/check-gateway.mjs
      - name: Deploy the gateway and retain the previous website and update indices
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59153da0809ff3d18297d943e1ef5b56'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node website/node_modules/wrangler/bin/wrangler.js deploy --config website/downloads.wrangler.jsonc --keep-vars
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node website/node_modules/wrangler/bin/wrangler.js deploy --config website/wrangler.jsonc --keep-vars
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify old archive redirects before retaining the newest three versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59153da0809ff3d18297d943e1ef5b56'
          WRANGLER_SEND_METRICS: 'false'
        run: python website/scripts/release_downloads.py prune --node node --wrangler website/node_modules/wrangler/bin/wrangler.js
      - name: Verify public packages and sign update indices
        env:
          FLICKDOCK_RELEASE_SIGNING_KEY: ${{ secrets.FLICKDOCK_RELEASE_SIGNING_KEY }}
        run: python release_pipeline.py sign
      - name: Check the completed website
        run: |
          node website/test/check-site.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node website/test/check-gateway.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish matching source and release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: python release_source_sync.py
      - name: Publish the website and signed update indices
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '59153da0809ff3d18297d943e1ef5b56'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node website/node_modules/wrangler/bin/wrangler.js deploy --config website/downloads.wrangler.jsonc --keep-vars
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node website/node_modules/wrangler/bin/wrangler.js deploy --config website/wrangler.jsonc --keep-vars
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the public website and signed update indices
        run: python release_pipeline.py verify
