name: Clipboard history Mac and Windows verification
on:
  push:
    branches: [ci-mac-clipboard-privacy-live-1845]

permissions:
  contents: read

jobs:
  clipboard:
    if: github.repository == 'los0711/-flickdock-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Verify stalled transfer recovery with an isolated clipboard
        if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=offscreen python -m unittest test_stability_v1822.PriorityIsolationTests.test_stalled_clipboard_keeps_metadata_and_shared_retry_alive -v
      - name: Verify native history paste on an isolated account
        run: python ci_clipboard_history_live.py
        env:
          FLICKDOCK_CLIPBOARD_HISTORY_QA: ${{ secrets.FLICKDOCK_CLIPBOARD_HISTORY_QA }}
