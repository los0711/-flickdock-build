name: Verify Windows Seda-style chat insertion

on:
  push:
    branches: [ci-flickdock-seda-editor-1840]

permissions:
  contents: read

jobs:
  seda:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the tested Qt and Seda's exact Electron release
        shell: pwsh
        run: |
          python -m pip install 'PySide6==6.12.0' 'cryptography==50.0.2' 'keyring==25.7.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/flickdock-electron-qa" --no-save --no-fund --no-audit electron@37.3.1
          exit $LASTEXITCODE
      - name: Exercise real input in the isolated Electron webviews
        shell: pwsh
        run: |
          $electron=Join-Path $env:RUNNER_TEMP 'flickdock-electron-qa/node_modules/electron/dist/electron.exe'
          python ci_seda_web_editor.py $electron seda-editor.json
      - name: Regress ordinary Chromium editors
        if: always()
        run: python ci_live_translation_web.py chromium-editor.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seda-editor-${{ github.sha }}
          path: |
            seda-editor.json
            chromium-editor.json
          retention-days: 3
