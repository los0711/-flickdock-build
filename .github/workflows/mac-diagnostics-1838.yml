name: Isolated Mac regression diagnostics
on:
  push:
    branches: [user-1838-mac-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r requirements.txt
      - name: Window animation tests in isolation
        id: zoom
        continue-on-error: true
        run: python -m unittest test_window_zoom_v1824 -v
      - name: Preview and trigger tests in isolation
        id: trigger
        continue-on-error: true
        run: python -m unittest test_trigger_reliability_v1810 -v
      - name: Typography tests in isolation
        id: typography
        continue-on-error: true
        run: python -m unittest test_html_native_workspace.WorkspaceTests.test_brand_title_is_smaller_bolder_and_optically_centered_on_logo test_html_native_workspace.WorkspaceTests.test_file_metadata_uses_latin_and_technical_faces -v
      - name: Report diagnostic failure
        if: steps.zoom.outcome != 'success' || steps.trigger.outcome != 'success' || steps.typography.outcome != 'success'
        run: exit 1
