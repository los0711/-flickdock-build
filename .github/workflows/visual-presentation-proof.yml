name: Visual presentation proof
on:
  push:
    branches: [ci-visual-throughput-1848]

permissions:
  contents: read

jobs:
  calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7fd26a00f228ba963c83c7618389cb131b234cd1
          path: comparison
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          @for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          cl /nologo /O2 /EHsc ci_display_capture_win.cpp /Fe:capture-win.exe /link d3d11.lib dxgi.lib
      - if: runner.os == 'macOS'
        run: xcrun swiftc -swift-version 5 -O -parse-as-library ci_display_capture_mac.swift -o capture-mac
      - run: python ci_visual_presentation.py
      - name: Compare actual presented pixels before and after
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONFAULTHANDLER: '1'
        run: |
          $exe = if ('${{ runner.os }}' -eq 'Windows') { 'capture-win.exe' } else { 'capture-mac' }
          $exe = Join-Path (Get-Location) $exe
          python ci_visual_scenarios.py --capture $exe --source comparison --out display-baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci_visual_scenarios.py --capture $exe --out display-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-scenes-${{ runner.os }}
          path: display-*.json
      - name: Regress frame handoff, source composition and text scrolling
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest test_display_frames test_scroll_motion_v1837 test_surface_source_cache test_text_preview_v1838 test_translator_v1844.NativeFixTests.test_long_source_and_result_scroll_by_pixels_and_keep_the_selection -q
  windows-installer:
    needs: calibration
    uses: ./.github/workflows/release-windows.yml
  macos-installer:
    needs: calibration
    uses: ./.github/workflows/macos-build.yml
    with:
      test_build: true
