name: Isolate FlickDock 1.8.39 Mac regression
on:
  push:
    branches: [diagnose-1.8.39-arm64]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r requirements.txt
      - name: Probe the native application font with Qt Cocoa
        run: |
          QT_QPA_PLATFORM=cocoa python - <<'PY'
          from PySide6.QtGui import QFontDatabase, QTextLayout
          from PySide6.QtWidgets import QApplication
          from native_ui_common import configure_reference_font
          app=QApplication([])
          font=configure_reference_font(app)
          system=QFontDatabase.systemFont(QFontDatabase.SystemFont.GeneralFont)
          assert font.families()[0]==system.families()[0]
          line=QTextLayout('FlickDock 翻译器', font)
          line.beginLayout()
          line.createLine()
          line.endLayout()
          faces={run.rawFont().familyName() for run in line.glyphRuns()}
          assert faces and all(face and 'Geist' not in face for face in faces)
          print('Cocoa logical families:',font.families(),'; resolved families:',faces)
          PY
      - name: Run related suites in separate Qt processes with fault handling
        run: |
          failures=0
          for case in test_overview_translator_followup.FontPolicyTests test_overview_translator_followup.AlignmentTests test_overview_translator_followup.TranslatorUITests test_overview_translator_followup.OverviewMotionTests test_polish_outline_v1849 test_mac_updates test_mac_install test_architecture; do
            python -X faulthandler -m unittest -v "$case" || failures=1
          done
          exit "$failures"
