name: Live editor translation proof

on:
  push:
    branches: [ci-live-editor-unrestricted-1840]

permissions:
  contents: read

jobs:
  live-editor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Qt runtime and test dependencies
        run: python -m pip install 'PySide6==6.12.0' 'cryptography==50.0.2' 'keyring==25.7.0'
      - name: Install Cocoa runtime bridge
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Run simulated editor and translation regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_live_translation_card test_auto_clipboard_translation test_translator_workflow_v1847 test_translation_copy_v1843 -v
      - name: Verify a native editor selection, secure field and insertion
        if: ${{ !cancelled() }}
        run: python ci_live_editor_native.py native-editor.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-editor-${{ runner.os }}
          path: native-editor.json
          if-no-files-found: ignore
          retention-days: 3
