name: Clipboard receiving regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install reviewed runtime
        run: python -m pip install -r requirements.txt
      - name: Install native pasteboard bindings
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Verify interrupted receive and native URL identity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_clipboard_sync_v1819 test_clipboard_history_v1823 test_clipboard_fast_v1821 test_shared_clipboard_files_v1821 test_stability_v1822 test_transfer_entry_v1822 test_video_matrix -q
      - name: Install isolated cloud service
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify native sending and receiving against real Worker and R2
        shell: pwsh
        run: |
          $env:FD_QA_PYTHON = (Get-Command python).Source
          node cloud/test/clipboard.mjs
