name: Native shelf direct delivery

on:
  push:
    branches: [ci-manual-lan-1842]

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
            platform: windows
            side: A
          - runner: macos-15
            architecture: arm64
            platform: cocoa
            side: C
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install PySide6==6.12.0 keyring==25.7.0 cryptography==50.0.2
      - run: python p2p_assets.py
      - name: Exercise real local, cross-runner and offline delivery
        shell: pwsh
        env:
          FLICKDOCK_SHELF_QA: ${{ secrets.FLICKDOCK_SHELF_QA }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ShelfDirectQA
          if ('${{ matrix.side }}' -eq 'A') {
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            $local = Start-Process -FilePath (Get-Command python).Source -WindowStyle Hidden -PassThru -ArgumentList @(
              'ci_shelf_routes_live.py', 'B', ('"' + (Join-Path $directory B) + '"')
            ) -RedirectStandardOutput (Join-Path $directory 'local.stdout') -RedirectStandardError (Join-Path $directory 'local.stderr')
          }
          python ci_shelf_routes_live.py ${{ matrix.side }} (Join-Path $directory ${{ matrix.side }})
          $result = $LASTEXITCODE
          if ($local) {
            if (-not $local.WaitForExit(120000)) { $local.Kill(); exit 1 }
            Get-Content -LiteralPath (Join-Path $directory 'local.stdout')
            if ($local.ExitCode -ne 0) { $result = $local.ExitCode }
          }
          exit $result
      - name: Retain proof without credentials or file content
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shelf-direct-${{ matrix.side }}
          path: ${{ runner.temp }}/ShelfDirectQA/*/shelf-route-report.json
          retention-days: 3
