name: Native shelf direct delivery

on:
  push:
    branches: [ci-shelf-direct-live]

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
            platform: windows
            side: A
          - runner: macos-15
            architecture: arm64
            platform: cocoa
            side: B
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install PySide6==6.12.0 keyring==25.7.0 cryptography==50.0.2
      - run: python p2p_assets.py
      - name: Send and receive a synthetic file through the public endpoint
        shell: pwsh
        env:
          FLICKDOCK_SHELF_QA: ${{ secrets.FLICKDOCK_SHELF_QA }}
        run: python ci_shelf_direct_live.py ${{ matrix.side }} (Join-Path $env:RUNNER_TEMP ShelfDirectQA)
      - name: Retain proof without credentials or file content
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shelf-direct-${{ matrix.side }}
          path: ${{ runner.temp }}/ShelfDirectQA/shelf-direct-report.json
          retention-days: 3
