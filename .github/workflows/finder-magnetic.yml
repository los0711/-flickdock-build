name: Finder magnetic drop

on:
  push:
    branches: [fix-mac-finder-magnetic-1841]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finder:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check the disposable Finder desktop
        run: |
          set -eu
          test "$GITHUB_ACTIONS" = true
          directory="$(mktemp -d)"
          touch "$directory/FlickDock-Fixture.txt"
          open -R "$directory/FlickDock-Fixture.txt"
          osascript -e 'with timeout of 5 seconds' -e 'tell application "Finder" to get name of every Finder window' -e 'end timeout' || true
          cat >"$directory/pointer.swift" <<'SWIFT'
          import Cocoa
          import CoreGraphics
          func testPointer() -> Bool {
            let point = CGPoint(x: 420, y: 420)
            guard let event = CGEvent(mouseEventSource: nil, mouseType: .mouseMoved,
                                      mouseCursorPosition: point, mouseButton: .left) else { return false }
            event.post(tap: .cghidEventTap)
            Thread.sleep(forTimeInterval: 0.3)
            return CGEvent(source: nil)?.location == point
          }
          print("finderRunning:", !NSRunningApplication.runningApplications(withBundleIdentifier: "com.apple.finder").isEmpty)
          print("eventAccess:", CGPreflightPostEventAccess())
          print("pointerEventDelivered:", testPointer())
          SWIFT
          swift "$directory/pointer.swift"
          osascript -l JavaScript <<'JXA'
          ObjC.import('CoreGraphics')
          const point = $.CGPointMake(440, 440)
          const event = $.CGEventCreateMouseEvent(null, 5, point, 0)
          $.CGEventPost(0, event)
          delay(0.3)
          const observed = $.CGEventGetLocation($.CGEventCreate(null))
          console.log('osascriptEventAccess=' + $.CGPreflightPostEventAccess())
          console.log('osascriptPointerEventDelivered=' + (observed.x === 440 && observed.y === 440))
          JXA
