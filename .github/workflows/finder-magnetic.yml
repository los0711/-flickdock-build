name: Finder magnetic drop

on:
  push:
    branches: [fix-mac-finder-magnetic-1841]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finder:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install Cocoa test dependencies
        run: python -m pip install -r requirements.txt 'pyobjc-framework-Quartz>=11,<13'
      - name: Drag real Finder fixtures to the source application
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/flickdock-finder-profile" "$RUNNER_TEMP/finder-source"
          swiftc ci_finder_element.swift -o "$RUNNER_TEMP/finder-element"
          HOME="$RUNNER_TEMP/flickdock-finder-profile" QT_QPA_PLATFORM=cocoa \
            FLICKDOCK_FINDER_AX="$RUNNER_TEMP/finder-element" \
            python flickdock.py --verify-finder-magnetic "$RUNNER_TEMP/finder-source/report.json"
      - name: Retain Finder test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finder-source-${{ github.sha }}
          path: ${{ runner.temp }}/finder-source/report.json
          if-no-files-found: warn
