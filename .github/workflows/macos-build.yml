name: macOS build mirror

on:
  workflow_call:
    inputs:
      test_build:
        type: boolean
        default: true
      desktop_checks:
        type: boolean
        default: false
      finder_checks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test_build:
        description: Unpublished test package; leave current public installer download unverified
        type: boolean
        default: false
      desktop_checks:
        description: Validate the desktop redesign alongside the native packaging checks
        type: boolean
        default: false
      finder_checks:
        description: Drag real Finder files into the app extracted from the generated installer
        type: boolean
        default: false
  push:
    branches: [cloud-build]

permissions:
  contents: read

concurrency:
  group: flickdock-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install native checks
        run: python -m pip install -r requirements.txt 'pyobjc-framework-Quartz>=11,<13'
      - name: Regress saved screenshots and permission identity
        run: |
          QT_QPA_PLATFORM=offscreen python - <<'PY'
          import unittest
          from PySide6.QtCore import QPoint
          from PySide6.QtGui import QCursor
          from PySide6.QtWidgets import QApplication
          app=QApplication([])
          app.setQuitOnLastWindowClosed(False)
          QCursor.setPos(QPoint(1200,900))
          suite=unittest.defaultTestLoader.loadTestsFromName('test_local_clipboard_history')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful()
          PY
          QT_QPA_PLATFORM=offscreen python -m unittest test_saved_screenshots test_mac_permissions_v1821 test_lan_account_v1825 test_wan_account_v1819 test_clipboard_sync_v1819 test_stability_v1822.PermissionRecoveryTests test_window_zoom_v1824 -q
      - name: Exercise native file events and movable permission window
        run: |
          profile="$(mktemp -d "$RUNNER_TEMP/saved-native.XXXXXX")"
          APPDATA="$profile" HOME="$profile" XDG_CONFIG_HOME="$profile" QT_QPA_PLATFORM=cocoa python verify_saved_screenshots.py --verify-saved-screenshots "$profile/source.json"
          cp "$profile/source.json" saved-screenshots-source.json
      - name: Paste native text and screenshot images into an independent app
        run: QT_QPA_PLATFORM=cocoa python ci_clipboard_history_native.py driver "$RUNNER_TEMP/history-native-test"
      - name: Stabilize hosted Dock area for default-size comparison
        run: |
          defaults write com.apple.dock autohide -bool true
          killall Dock
          sleep 2
      - name: Verify native utility controls before packaging
        run: python ci_utility_windows.py --output "$RUNNER_TEMP/native-utility-source.json"
      - name: Retain native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-saved-screenshot-native
          path: |
            saved-screenshots-source.json
            ${{ runner.temp }}/saved-native.*/source.json
          retention-days: 3

