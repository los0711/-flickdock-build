name: macOS build mirror

on:
  workflow_dispatch:
  push:
    branches: [cloud-build]

permissions:
  contents: read

concurrency:
  group: flickdock-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The user explicitly authorized this existing public GitHub build mirror.
    # The canonical Gitee source repository remains private.
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Build and verify native application, ZIP, DMG and installer
        run: |
          python ci_assets.py
          python build_macos.py --target-arch '${{ matrix.arch }}'
      - name: Actual frozen private cleanup entry and original-byte protection
        timeout-minutes: 3
        run: |
          mkdir -p build/cleanup-frozen
          cleanup_exe="$PWD/dist/FlickDock.app/Contents/MacOS/FlickDock"
          cleanup_hash="$(shasum -a 256 "$cleanup_exe" | cut -d ' ' -f1)"
          cleanup_nonce="$(python -c 'from uuid import uuid4; print(uuid4().hex)')"
          cleanup_exit=0
          build/macos-venv/bin/python qa/hosted_cleanup_gate.py --hosted-cleanup --nonce "$cleanup_nonce" --repo "$PWD" --exe "$cleanup_exe" --exe-sha256 "$cleanup_hash" > build/cleanup-frozen/report.jsonl 2>&1 || cleanup_exit=$?
          cat build/cleanup-frozen/report.jsonl
          exit "$cleanup_exit"
      - name: Preserve frozen cleanup receipt even if later platform tests fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-frozen-${{ matrix.arch }}-${{ github.sha }}
          path: build/cleanup-frozen/
          if-no-files-found: warn
          retention-days: 3
      - name: Verify final functional layout, cancellation and helper handoff boundaries
        run: |
          build/macos-venv/bin/python qt_unittest.py test_ui_polish_v1823 test_functional_layout_v1823 test_update_exit_v1823 test_update_macos_controller -q
          build/macos-venv/bin/python qt_unittest.py test_update_inline_v171 -q
      - name: Verify finite feedback, input, stack and live compositor handoff
        run: |
          build/macos-venv/bin/python qt_unittest.py test_win_clipboard_io_v1825 test_win_clipboard_cache_v1825 test_clipboard_native_read_v1825 test_clipboard_worker_outcomes_v1825 test_clipboard_reader_entry_v1825 test_clipboard_cleanup_v1825 test_clipboard_cleanup_entry_v1825 test_clipboard_audit_source_v1825 test_clipboard_local_original_v1825 test_native_text_budget_v1825 test_native_text_single_pass_v1825 test_clipboard_presenter_lifecycle_v1825 -v
          build/macos-venv/bin/python qt_unittest.py test_clipboard_empty_bootstrap_v1825 test_clipboard_empty_receive_v1825 test_clipboard_private_baseline_v1825 test_native_read_retry_v1825 test_native_image_fidelity_v1825 test_shelf_stage_store_v1825.CanonicalStageTests test_shelf_payload_gate_v1825 -v
          build/macos-venv/bin/python qt_unittest.py test_popup_subscription_v1825 test_clipboard_popup_native_events_v1825 test_modal_owner_lifecycle_v1825 test_secondary_window_handoff_v1825 test_chrome_event_scope_v1825 test_morph_text_scale_v1825 test_card_style_ownership_v1825 -v
          build/macos-venv/bin/python qt_unittest.py test_shelf_control_transport_v1825 -v
          build/macos-venv/bin/python qt_unittest.py test_clipboard_reenable_v1825 -v
          build/macos-venv/bin/python qt_unittest.py test_clipboard_size_contract_v1825 test_clipboard_multipart_v1825 -v
          build/macos-venv/bin/python qt_unittest.py test_windows_reveal_v1824 test_transfer_balance_v1824 test_item_reflow_occlusion_v1824 test_native_owner_lifetime_v1824 test_frame_animation_v1824 test_screen_animation_timer_v1824 test_clipboard_loop_v1824 test_sync_switch_lifecycle_v1824 test_user_popup_fixes_v1823 test_standard_control_states_v1824 test_disabled_field_states_v1824 -q
          build/macos-venv/bin/python qt_unittest.py test_ui_followup_v1823 test_cached_surface_v1823 test_stack_spread_v1823 test_input_motion_v1823 test_content_entrance_v1823 test_transfer_drop_feedback_v1823 test_transfer_item_motion_v1823 test_popup_motion_v1823 test_drop_target_motion_v1823 test_morph_snapshot_content_v1824 -q
          build/macos-venv/bin/python qt_unittest.py test_clipboard_notice_motion_v1823 test_clipboard_popup_motion_v1823 test_mac_status_drop_v1823 test_mac_permissions_v1821 test_presentation_v1819.PresentationTests -q
          build/macos-venv/bin/python test_surface_continuity_v162.py
      - name: Test real cloud sync from frozen macOS client
        run: |
          profile="$(mktemp -d)"
          APPDATA="$profile" XDG_CONFIG_HOME="$profile" dist/FlickDock.app/Contents/MacOS/FlickDock --verify-cloud --verify-output "../outputs/mac-cloud-${{ matrix.arch }}.json" || true
          python -c "import json; from pathlib import Path; p=Path('../outputs/mac-cloud-${{ matrix.arch }}.json'); data=json.loads(p.read_text()); print(data); assert data['ok'] and data['frozen'],data"
      - name: Verify transfer isolation, display metadata and finite animation lifecycle
        run: |
          build/macos-venv/bin/python qt_unittest.py test_stability_v1822 test_resources_v1822.ResourceTests test_motion_resources_v1822.MotionTests test_motion_resources_v1822.DisplayMetadataTests test_motion_resources_v1822.MacVolumeTests test_receive_lifecycle_v1822.ReceiveLifecycleTests test_transfer_entry_v1822.EntryTests test_small_upload_lane.SmallLaneTests -q
      - name: Measure verified local LAN loopback transfer
        run: |
          build/macos-venv/bin/python bench_lan_throughput_v183.py --size-mib 128 --output "../outputs/mac-lan-${{ matrix.arch }}.json"
      - name: Gather verified release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source, target = Path('../outputs'), Path('ci-output')
          target.mkdir()
          for pattern in ('FlickDock-*-macOS-${{ matrix.arch }}.zip', 'FlickDock-*-macOS-${{ matrix.arch }}.dmg', 'FlickDock-*-macOS-${{ matrix.arch }}.pkg', 'mac-build-*-${{ matrix.arch }}.json', 'mac-cloud-${{ matrix.arch }}.json', 'mac-lan-${{ matrix.arch }}.json'):
              files = list(source.glob(pattern))
              assert len(files) == 1, (pattern, files)
              for path in files:
                  shutil.copy2(path, target / path.name)
          PY
      - name: Retain build artifacts for verification
        id: release_upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlickDock-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: ci-output/*
          if-no-files-found: error
          retention-days: 3
      - name: Retry artifact connection after transient service or DNS failure
        if: steps.release_upload.outcome == 'failure'
        run: sleep 8
      - name: Retry verified artifacts without rebuilding
        if: steps.release_upload.outcome == 'failure'
        id: release_upload_retry
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlickDock-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: ci-output/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Wait before final bounded artifact retry
        if: steps.release_upload_retry.outcome == 'failure'
        run: sleep 20
      - name: Final artifact upload attempt
        if: steps.release_upload_retry.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlickDock-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: ci-output/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true
