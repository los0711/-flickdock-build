name: Package supplied Mac app for signed online updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Download exact supplied installer images
        run: |
          mkdir input output
          curl --fail --show-error --location --retry 3 --max-time 600 -o input/original.pkg https://download-origin.flickdock.cc.cd/v1.8.37/FlickDock-1.8.37-macOS-arm64.pkg
          curl --fail --show-error --location --retry 3 --max-time 600 -o input/original.dmg https://download-origin.flickdock.cc.cd/v1.8.37/FlickDock-1.8.37-macOS-arm64.dmg
      - name: Install existing updater's Qt dependencies
        run: python -m pip install 'PySide6-Essentials==6.12.0'
      - name: Verify supplied app and create its update ZIP
        run: |
          python - <<'PY'
          import hashlib,json,os,plistlib,subprocess,sys,tempfile
          from pathlib import Path
          from build_macos import _bundle_inventory,_create_zip,_checksum
          pkg=Path('input/original.pkg');dmg=Path('input/original.dmg')
          assert pkg.stat().st_size==79769481 and _checksum(pkg)=='4cec2e789c194e17a8b1df5b7d6cb9f560cad9a760bf3538e485da11f8da228f'
          assert dmg.stat().st_size==96831764 and _checksum(dmg)=='475abae92afb1f5a38ba61ea5f3b35594ae2147d3d9ba54f31d63dc9e83b89fe'
          archive=Path('output/FlickDock-1.8.37-macOS-arm64.zip').resolve()
          with tempfile.TemporaryDirectory(prefix='flickdock-supplied-package-') as directory:
              base=Path(directory);expanded=base/'expanded'
              subprocess.run(['/usr/sbin/pkgutil','--expand-full',str(pkg.resolve()),str(expanded)],check=True,timeout=120)
              app=expanded/'Payload/FlickDock.app'
              info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
              assert info['CFBundleIdentifier']=='com.flickdock.app' and info['CFBundleShortVersionString']=='1.8.37'
              arch=subprocess.check_output(['/usr/bin/lipo','-archs',str(app/'Contents/MacOS/FlickDock')],text=True).strip().split()
              assert 'arm64' in arch
              subprocess.run(['/usr/bin/codesign','--verify','--deep','--strict',str(app)],check=True,timeout=60)
              subprocess.run(['/usr/bin/hdiutil','verify',str(dmg.resolve())],check=True,timeout=120)
              mount=base/'mounted';mount.mkdir()
              subprocess.run(['/usr/bin/hdiutil','attach','-readonly','-nobrowse','-mountpoint',str(mount),str(dmg.resolve())],check=True,timeout=120)
              try:
                  assert _bundle_inventory(app)==_bundle_inventory(mount/'FlickDock.app'), 'PKG and DMG contain different applications'
              finally:
                  subprocess.run(['/usr/bin/hdiutil','detach',str(mount)],check=True,timeout=60)
              _create_zip(app.resolve(),archive,python=sys.executable,env=dict(os.environ,QT_QPA_PLATFORM='offscreen'))
          result=dict(ok=True,version='1.8.37',architecture='arm64',source_pkg_sha256=_checksum(pkg),
                      pkg_dmg_same_app=True,code_signature_verified=True,updater_zip_roundtrip_verified=True,
                      name=archive.name,bytes=archive.stat().st_size,sha256=_checksum(archive))
          Path('output/mac-original-package-verification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: Retain verified update ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flickdock-supplied-mac-update-v1837
          path: output/*
          if-no-files-found: error
          retention-days: 3

