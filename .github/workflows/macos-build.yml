name: macOS build mirror

on:
  workflow_dispatch:
  push:
    branches: [cloud-build]

permissions:
  contents: read

concurrency:
  group: flickdock-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The user explicitly authorized this existing public GitHub build mirror.
    # The canonical Gitee source repository remains private.
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Build and verify native application, ZIP, DMG and installer
        run: |
          python ci_assets.py
          python build_macos.py --target-arch '${{ matrix.arch }}'
      - name: Test real cloud sync from frozen macOS client
        run: |
          profile="$(mktemp -d)"
          APPDATA="$profile" XDG_CONFIG_HOME="$profile" dist/FlickDock.app/Contents/MacOS/FlickDock --verify-cloud --verify-output "../outputs/mac-cloud-${{ matrix.arch }}.json" || true
          python -c "import json; from pathlib import Path; p=Path('../outputs/mac-cloud-${{ matrix.arch }}.json'); data=json.loads(p.read_text()); print(data); assert data['ok'] and data['frozen'],data"
      - name: Verify transfer isolation, display metadata and finite animation lifecycle
        run: |
          build/macos-venv/bin/python -m unittest test_stability_v1822 test_resources_v1822.ResourceTests test_motion_resources_v1822.MotionTests test_motion_resources_v1822.DisplayMetadataTests test_receive_lifecycle_v1822.ReceiveLifecycleTests test_transfer_entry_v1822.EntryTests test_small_upload_lane.SmallLaneTests -q
      - name: Measure verified local LAN loopback transfer
        run: |
          build/macos-venv/bin/python bench_lan_throughput_v183.py --size-mib 128 --output "../outputs/mac-lan-${{ matrix.arch }}.json"
      - name: Gather verified release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source, target = Path('../outputs'), Path('ci-output')
          target.mkdir()
          for pattern in ('FlickDock-*-macOS-${{ matrix.arch }}.zip', 'FlickDock-*-macOS-${{ matrix.arch }}.dmg', 'FlickDock-*-macOS-${{ matrix.arch }}.pkg', 'mac-build-*-${{ matrix.arch }}.json', 'mac-cloud-${{ matrix.arch }}.json', 'mac-lan-${{ matrix.arch }}.json'):
              files = list(source.glob(pattern))
              assert len(files) == 1, (pattern, files)
              for path in files:
                  shutil.copy2(path, target / path.name)
          PY
      - name: Retain build artifacts for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlickDock-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: ci-output/*
          if-no-files-found: error
          retention-days: 3
