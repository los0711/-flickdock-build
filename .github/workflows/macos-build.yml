name: Isolated native macOS material probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cocoa-material:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing UI and native framework dependencies
        run: python -m pip install PySide6==6.12.0 'pyobjc-framework-Quartz>=11,<13'
      - name: Verify injected backend lifecycle without OS mutation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_window_material_v1823 -v
      - name: Verify actual native compositor pixels on dummy windows
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          target=Path('material-proof');target.mkdir()
          sources={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ('window_material.py','ci_material_probe.py','test_window_material_v1823.py')}
          (target/'producer.json').write_text(json.dumps(dict(commit=os.environ['GITHUB_SHA'],sources=sources,scope='Ephemeral CI dummy Qt windows; no application integration or user desktop'),indent=2))
          subprocess.run([sys.executable,'ci_material_probe.py',str(target/'material-macos.json')],check=True,timeout=45)
          PY
      - name: Preserve raw native success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-macos-${{ github.sha }}
          path: material-proof/*
          retention-days: 3
          if-no-files-found: warn
