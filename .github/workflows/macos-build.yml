name: macOS build mirror

on:
  workflow_call:
    inputs:
      test_build:
        type: boolean
        default: true
      desktop_checks:
        type: boolean
        default: false
      finder_checks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test_build:
        description: Unpublished test package; leave current public installer download unverified
        type: boolean
        default: false
      desktop_checks:
        description: Validate the desktop redesign alongside the native packaging checks
        type: boolean
        default: false
      finder_checks:
        description: Drag real Finder files into the app extracted from the generated installer
        type: boolean
        default: false
  push:
    branches: [cloud-build]

permissions:
  contents: read

concurrency:
  group: flickdock-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The user explicitly authorized this existing public GitHub build mirror.
    # The canonical Gitee source repository remains private.
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    runs-on: xcode-27
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Verify real Cocoa hover, paste, screenshots and display clock
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          python -m venv build/macos-venv
          build/macos-venv/bin/python -m pip install 'PySide6==6.12.0' 'pyobjc-framework-Quartz>=11,<13'
          profile="$(mktemp -d "$RUNNER_TEMP/history-native.XXXXXX")"
          HOME="$profile" APPDATA="$profile" XDG_CONFIG_HOME="$profile" build/macos-venv/bin/python ci_clipboard_history_native.py driver "$profile"
