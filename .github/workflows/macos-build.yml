name: macOS build mirror

on:
  workflow_call:
    inputs:
      test_build:
        type: boolean
        default: true
      desktop_checks:
        type: boolean
        default: false
      finder_checks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test_build:
        description: Unpublished test package; leave current public installer download unverified
        type: boolean
        default: false
      desktop_checks:
        description: Validate the desktop redesign alongside the native packaging checks
        type: boolean
        default: false
      finder_checks:
        description: Drag real Finder files into the app extracted from the generated installer
        type: boolean
        default: false
  push:
    branches: [cloud-build]

permissions:
  contents: read

concurrency:
  group: flickdock-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install native checks
        run: python -m pip install -r requirements.txt 'pyobjc-framework-Quartz>=11,<13'

      - name: Diagnose native utility geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          value=Path('ci_utility_windows.py').read_text()
          value=value.replace('initial=window.size();area=window.screen().availableGeometry()', "initial=window.size();area=window.screen().availableGeometry();print('INITIAL',window.windowTitle(),initial,area,flush=True)")
          value=value.replace('assert window.size()==initial,(window.size(),initial)', "print('REOPEN',window.windowTitle(),window.size(),initial,area,window.screen().availableGeometry(),flush=True);assert window.size()==initial,(window.size(),initial)")
          sys.argv=['ci_utility_windows.py','--output','native-geometry.json']
          exec(compile(value,'ci_utility_windows.py','exec'),{'__name__':'__main__','__file__':str(Path('ci_utility_windows.py').resolve())})
          PY
