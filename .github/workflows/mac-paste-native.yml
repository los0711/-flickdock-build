name: Verify Mac clipboard recovery and editor replacement

on:
  push:
    branches: [ci-flickdock-mac-paste-1840]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install native test dependencies
        run: python -m pip install -r requirements.txt 'pyobjc-framework-Quartz>=11,<13'
      - name: Regress permission setup after same-version reinstall
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_mac_permissions_v1821.PermissionIdentityTests test_mac_permissions_v1821.PermissionTests
      - name: Run native card and clipboard tests on the supported system pasteboard
        if: matrix.os == 'macos-15'
        run: |
          python ci_live_editor_card.py native-card.json
          python ci_live_translation_web.py embedded-editor.json
      - name: Regress native clipboard history, original contents and cloud fences
        if: always() && matrix.os == 'macos-15'
        run: python ci_clipboard_history_native.py driver "$RUNNER_TEMP/clipboard-history"
      - name: Exercise native Electron chat editing with or without pasteboard access
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/flickdock-electron-qa" --no-save --no-fund --no-audit electron@37.3.1
          python ci_mac_electron_editor.py "$RUNNER_TEMP/flickdock-electron-qa/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" native-electron.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-paste-${{ matrix.os }}-${{ github.sha }}
          path: |
            native-card.json
            embedded-editor.json
            native-electron.json
          if-no-files-found: warn
          retention-days: 3
