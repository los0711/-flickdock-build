name: Diagnose Cocoa widgets before packaging

on:
  push:
    branches: [ci-cocoa-release-check-1839]

permissions:
  contents: read

jobs:
  cocoa:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 26b24c3d3fb61e03bfcbadcf38a39896eb8c294d
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install Cocoa test dependencies
        run: python -m pip install 'PySide6==6.12.0' 'pyobjc-framework-Quartz>=11,<13' 'keyring==25.7.0' 'cryptography==50.0.2' 'requests==2.34.2'
      - name: Verify deterministic frame completion and scroll motion
        run: python -m unittest test_display_frames test_scroll_motion_v1837.ScrollTests test_edge_magnetic_v1839.FieldGeometryTests test_lan_dialog_v183.LanDialogTests.test_mac_activity_cards_stay_fixed_while_history_scrolls -q
