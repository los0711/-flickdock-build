name: Diagnose Cocoa widgets before packaging

on:
  push:
    branches: [ci-cocoa-release-check-1839]

permissions:
  contents: read

jobs:
  cocoa:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 505a2d503387c8463940b624aa6e661c489e0132
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install Cocoa test dependencies
        run: python -m pip install 'PySide6==6.12.0' 'pyobjc-framework-Quartz>=11,<13' 'keyring==25.7.0' 'cryptography==50.0.2' 'requests==2.34.2'
      - name: Verify Cocoa utility interactions before freezing
        run: python ci_utility_windows.py
      - name: Check leading controls in the Cocoa translator
        if: always()
        run: |
          profile="$(mktemp -d)"
          cd "$GITHUB_WORKSPACE"
          HOME="$profile" APPDATA="$profile" XDG_CONFIG_HOME="$profile" QT_QPA_PLATFORM=cocoa FLICKDOCK_VERIFY_NATIVE_UI=1 python flickdock.py --verify-translator --verify-output "$profile/report.json" || true
          cat "$profile/report.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["mac_leading_controls"]' "$profile/report.json"
