name: Normal frozen Windows native QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normal-frozen-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-normal-entry:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install reviewed runtime and isolated external QA driver
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pywinauto==0.6.9 mss==10.1.0 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix cloud --no-audit --no-fund
      - name: Check explicit reviewed source manifest
        run: |
          python -m unittest discover -s qa/packaged-live -p test_harness_bounds.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --before-build
      - name: Build actual native executable with the production entry
        run: |
          python ci_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python p2p_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean FlickDock.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --after-build
      - name: Normal frozen process, external native Copy/Paste, policy switches and actual screen frames
        shell: pwsh
        run: |
          $nativeExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $nativeHash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --actions qa/packaged-live/ui-actions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve actual QA pixels and exact tested executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: normal-frozen-windows-${{ github.sha }}
          path: |
            build/normal-native-qa/
            build/normal-source-verification.json
            dist/FlickDock/
          if-no-files-found: error
          retention-days: 3
