name: Inventory FlickDock installer archives

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flickdock-central-release
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'los0711/-flickdock-build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: flickdock-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: List public Gitee releases and attachments
        env:
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: python archive_history.py --output "${RUNNER_TEMP}/flickdock-archive-inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlickDock-public-archive-inventory
          path: ${{ runner.temp }}/flickdock-archive-inventory.json
          retention-days: 3
