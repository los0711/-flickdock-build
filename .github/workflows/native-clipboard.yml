name: Published updater verification
run-name: ${{ inputs.phase }} frozen macOS updater verification
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verify existing public channel before release, or new channel after release
        required: true
        default: preflight
        type: choice
        options: [preflight, readback]
permissions:
  contents: read
  actions: read
jobs:
  updater:
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QA_PHASE: ${{ inputs.phase }}
      QA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install only the reviewed extraction dependency
        run: python -m pip install PySide6==6.12.0
      - name: Retrieve the exact verified native release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FlickDock-macOS-${{ matrix.arch }}-7114ca46455bb1dd05f1304eb0ae2340ea275ed1
          path: qa-artifact
          repository: los0711/-flickdock-build
          run-id: '41177462574'
          github-token: ${{ github.token }}
      - name: Run the shipped frozen updater against the real public channel
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tempfile,zipfile
          from pathlib import Path
          from mac_updates import _extract
          from release_macos import _validate_bundle
          arch=os.environ['QA_ARCH'];phase=os.environ['QA_PHASE']
          assert phase in ('preflight','readback')
          root=Path.cwd();artifact=root/'qa-artifact'
          build=json.loads((artifact/f'mac-build-1.8.23-{arch}.json').read_text())
          assert build['ok'] and build['version']=='1.8.23' and build['architecture']==arch
          archive=artifact/f'FlickDock-1.8.23-macOS-{arch}.zip'
          item=next(x for x in build['artifacts'] if x['name']==archive.name)
          with archive.open('rb') as stream:checksum=hashlib.file_digest(stream,'sha256').hexdigest()
          assert archive.stat().st_size==item['bytes'] and checksum==item['sha256']
          _validate_bundle(archive,'1.8.23',arch)
          output=root/f'updater-{phase}-{arch}.json'
          current,target=('1.8.21','1.8.22') if phase=='preflight' else ('1.8.22','1.8.23')
          with tempfile.TemporaryDirectory(prefix='flickdock-native-updater-') as directory:
              folder=Path(directory)
              with zipfile.ZipFile(archive) as package:app=_extract(package,folder/'stage',None)
              env={key:value for key,value in os.environ.items() if not any(word in key.upper() for word in ('TOKEN','SECRET','PASSWORD','CREDENTIAL')) and key not in ('SSH_AUTH_SOCK','GIT_ASKPASS')}
              profile=folder/'profile';profile.mkdir()
              env.update(HOME=str(profile),APPDATA=str(profile),LOCALAPPDATA=str(profile),XDG_CONFIG_HOME=str(profile),QT_QPA_PLATFORM='offscreen')
              command=[str(app/'Contents/MacOS/FlickDock'),'--verify-update','--verify-current',current,'--verify-output',str(output)]
              result=subprocess.run(command,env=env,timeout=240)
              data=json.loads(output.read_text()) if output.exists() else {}
              assert result.returncode==0 and data.get('ok') and data.get('frozen'),data
              assert data.get('version')=='1.8.23' and data.get('available_version')==target and data.get('latest_version')==target,data
              assert data.get('verified_download') is True and data.get('download_bytes',0)>0 and data.get('installer_executed') is False,data
              data.update(verification_phase=phase,architecture=arch,native_artifact_run=41177462574,native_artifact_commit='7114ca46455bb1dd05f1304eb0ae2340ea275ed1',native_archive_sha256=checksum,installed=False)
              output.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
              print(json.dumps(data,ensure_ascii=False))
          PY
      - name: Retain actual updater results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: updater-${{ inputs.phase }}-${{ matrix.arch }}
          path: updater-${{ inputs.phase }}-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 3
