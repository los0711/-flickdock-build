name: Native clipboard verification

on:
  workflow_dispatch:
    inputs:
      diagnostic_probe:
        description: Standalone owned QA only; not application or installer acceptance
        type: choice
        options: [none, owned-producer-lookup, explicit-paste-formats]
        default: none
      cleanup_boundaries:
        description: Isolated real process/filesystem cleanup checks; not frozen application or installer acceptance
        type: boolean
        default: false
      text_profile:
        description: Isolated Mac Intel synthetic text phase evidence only; not normal or installer acceptance
        type: boolean
        default: false
      native_checks:
        description: Run platform checks, disable only when identical runtime and maintained tests were already checked
        type: boolean
        default: true
      cloud_contract:
        description: Re-run unchanged service contracts
        type: boolean
        default: true
      normal_frozen:
        description: Build and verify normal frozen Windows executable
        type: boolean
        default: true
      installer_acceptance:
        description: Explicit final installer validation only after complete implementation and actual UI review
        type: boolean
        default: false
      reuse_normal_run:
        description: Existing exact-source normal dist artifact run, optional
        type: string
        default: ''
      normal_actions_scope:
        description: Full acceptance or isolated native observation (never installer acceptance)
        type: choice
        options: [full, core, tray-observation, recent-observation, writer-observation, receive-first-observation]
        default: full
      reveal_probe:
        description: Run the isolated Windows Shell selection diagnostic
        type: boolean
        default: false
  push:
    branches: [cloud-build]

permissions:
  contents: read
  actions: read

jobs:
  explicit-paste-format-probe:
    if: github.repository == 'los0711/-flickdock-build' && github.event_name == 'workflow_dispatch' && inputs.diagnostic_probe == 'explicit-paste-formats'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FD_QA_NATIVE: '1'
      FD_EXPLICIT_PASTE_FORMAT_PROBE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate pure guards and codecs before native dependencies
        shell: pwsh
        run: |
          python qa/packaged-live/verify_frozen_source.py --before-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s qa/explicit-paste-format-probe -p test_probe_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact existing application dependencies for Qt converter compatibility
        run: python -m pip install -r requirements.txt
      - name: Standalone owned native format observation on this fresh runner
        shell: pwsh
        run: |
          python -X utf8 qa/explicit-paste-format-probe/qt_format_probe.py --source-root $PWD --output build/explicit-paste-format-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw observation including failure and unverified formats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explicit-paste-formats-${{ github.sha }}-${{ github.run_attempt }}
          path: build/explicit-paste-format-probe/
          if-no-files-found: error
          retention-days: 3

  owned-producer-lookup-probe:
    if: github.repository == 'los0711/-flickdock-build' && github.event_name == 'workflow_dispatch' && inputs.diagnostic_probe == 'owned-producer-lookup'
    runs-on: windows-latest
    timeout-minutes: 4
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FD_QA_NATIVE: '1'
      FD_OWNED_PRODUCER_LOOKUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Pure guards, kernel fakes and resource failures before native dependencies
        shell: pwsh
        run: |
          python qa/packaged-live/verify_frozen_source.py --before-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s qa/owned-producer-lookup -p test_lookup_probe.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing Qt and UIA versions only; no application build
        run: python -m pip install PySide6==6.12.0 pywinauto==0.6.9 pywin32==311
      - name: Compare the same owned external producer in isolated protected workers
        shell: pwsh
        run: |
          python -X utf8 qa/owned-producer-lookup/lookup_probe.py --output "$env:GITHUB_WORKSPACE/build/owned-producer-lookup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original failure even when owned-handle lookup succeeds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-producer-lookup-${{ github.sha }}-${{ github.run_attempt }}
          path: build/owned-producer-lookup/
          if-no-files-found: error
          retention-days: 3

  cleanup-boundaries:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.cleanup_boundaries == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify exact reviewed files and pure guard/resource cases
        shell: pwsh
        run: |
          python qa/packaged-live/verify_frozen_source.py --before-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa -p test_hosted_cleanup_gate_v1825.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the existing reviewed Qt version
        run: python -m pip install PySide6==6.12.0
      - name: Actual default source helper, directory protection and timeout retirement
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/cleanup-boundaries | Out-Null
          $cleanupNonce = [Guid]::NewGuid().ToString('N')
          python qa/hosted_cleanup_gate.py --hosted-cleanup --nonce $cleanupNonce --repo $PWD --source-only *> build/cleanup-boundaries/report.jsonl
          $cleanupExit = $LASTEXITCODE
          Get-Content -LiteralPath build/cleanup-boundaries/report.jsonl
          if ($cleanupExit -ne 0) { exit $cleanupExit }
      - name: Original startup and unreadable-clipboard cleanup with owned fixtures
        shell: pwsh
        run: |
          python qt_unittest.py test_clipboard_sync_v1819.ClipboardTests.test_startup_reaps_expired_owned_cache_and_preserves_unmarked_directories test_mac_permissions_v1821.ClipboardPermissionTests.test_unreadable_clipboard_never_causes_file_cache_deletion -v *> build/cleanup-boundaries/startup-cache-fixture.log
          $fixtureExit = $LASTEXITCODE
          Get-Content -LiteralPath build/cleanup-boundaries/startup-cache-fixture.log
          @{ python_exit_code=$fixtureExit; original_wait_seconds=5; synthetic_backend=$false; scope='Original owned signed-out ClipboardSync startup deletion; unmarked original preserved; no OS clipboard test' } |
            ConvertTo-Json | Set-Content -LiteralPath build/cleanup-boundaries/startup-cache-fixture.json -Encoding utf8
          if ($fixtureExit -ne 0) { exit $fixtureExit }
      - name: Preserve real boundary receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-boundaries-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/cleanup-boundaries/
            build/normal-source-verification.json
          if-no-files-found: error
          retention-days: 3
  text-profile:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.text_profile == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 6
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QT_QPA_PLATFORM: offscreen
      FD_QA_TEXT_PROFILE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install identical reviewed Qt runtime
        run: python -m pip install PySide6==6.12.0
      - name: Original complete deadline test without profiling hooks
        run: |
          python -m unittest discover -s qa -p test_native_text_plain.py -v
          python qa/native_text_plain.py --output build/native-text-plain
      - name: Trace actual default deadline without relaxing its original assertions
        if: always()
        run: python qa/native_text_profile.py --output build/native-text-profile
      - name: Preserve original failure and phase evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-text-profile-${{ github.sha }}
          path: |
            build/native-text-profile/
            build/native-text-plain/
          if-no-files-found: error
          retention-days: 3
  reveal-probe:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.reveal_probe == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install read-only Shell observation binding
        run: python -m pip install pywin32==311
      - name: Observe actual Shell selection with official API variants
        run: python qa/packaged-live/ci_windows_reveal_probe.py --output build/windows-reveal-probe
      - name: Preserve real Shell results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-reveal-probe-${{ github.sha }}
          path: build/windows-reveal-probe/
          if-no-files-found: error
          retention-days: 3

  passed-installer:
    # A user-authorized trial can consume a previously successful, immutable
    # full normal-entry receipt. This is not an observation or a release job.
    if: github.repository == 'los0711/-flickdock-build' && github.event_name == 'workflow_dispatch' && github.event.inputs.installer_acceptance == 'true' && github.event.inputs.normal_frozen == 'false' && github.event.inputs.native_checks == 'false' && github.event.inputs.cloud_contract == 'false' && github.event.inputs.normal_actions_scope == 'full' && github.event.inputs.reuse_normal_run != ''
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FD_QA_NATIVE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the unchanged frozen-source verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the reviewed source and passed-receipt reuse guards
        run: |
          python -m unittest discover -s qa/packaged-live -p test_reuse_passed_normal.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --before-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retrieve exact dist and the original successful full GUI receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_NORMAL_RUN: ${{ inputs.reuse_normal_run }}
        run: |
          python qa/packaged-live/reuse_frozen.py --run $env:REUSE_NORMAL_RUN --require-passed-normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure the native production installer compiler
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and validate the exact trial installer against the passed program
        run: |
          $nativeExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $nativeHash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          python qa/packaged-live/ci_exact_installer.py --root $PWD --exe $nativeExe --sha256 $nativeHash --normal-report build/passed-normal-report.json --output build/exact-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the tested trial installer and immutable input receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: passed-installer-windows-${{ github.sha }}
          path: |
            build/exact-installer/
            build/passed-normal-report.json
            build/passed-normal-source-verification.json
            build/normal-source-verification.json
            build/reused-frozen-receipt.json
          if-no-files-found: error
          retention-days: 3

  cloud-contract:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.cloud_contract != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install locked local service test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual workerd, D1, R2 and signaling contracts
        run: |
          npm run typecheck --prefix cloud
          npm test --prefix cloud
          node cloud/test/clipboard-limits.mjs
          node cloud/test/clipboard-multipart.mjs
  clipboard:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.native_checks != 'false'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the reviewed Qt runtime
        run: python -m pip install PySide6==6.12.0
      - name: Install native macOS pasteboard bindings
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Check clipboard source ownership and real external editor Copy
        run: python ci_clipboard_origin.py --output clipboard-origin-native.json
      - name: Observe actual native transfer-to-overview handoff
        run: python ci_transfer_navigation.py
      - name: Check delayed formats, input fields and shared upload regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler qt_unittest.py test_clipboard_origin_v1823 test_clipboard_loop_v1824 test_sync_switch_lifecycle_v1824 test_transfer_interaction_v1823 test_clipboard_sync_v1819 test_clipboard_fast_v1821 test_shared_clipboard_files_v1821 test_pointer_paste_v1819 -v
      - name: Verify independent updater handoff regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler qt_unittest.py test_update_inline_v171 -v
      - name: Verify current platform file-manager and functional layout contracts before full builds
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler qt_unittest.py test_ui_polish_v1823 test_functional_layout_v1823 test_update_exit_v1823 test_update_macos_controller -v
      - name: Verify frame lifecycle, popup and real control-state paint regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler qt_unittest.py test_windows_reveal_v1824 test_transfer_balance_v1824 test_item_reflow_occlusion_v1824 test_native_owner_lifetime_v1824 test_frame_animation_v1824 test_screen_animation_timer_v1824 test_user_popup_fixes_v1823 test_standard_control_states_v1824 test_disabled_field_states_v1824 -v
      - name: Verify all motion paths with explicit ordinary and reduced-motion prerequisites
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnostics = Join-Path $PWD 'build/native-motion-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          function Invoke-MotionCheck([string]$name, [string[]]$arguments) {
            if ($arguments.Count -ge 3 -and $arguments[0] -eq '-m' -and $arguments[1] -eq 'unittest') {
              $arguments = @('qt_unittest.py') + $arguments[2..($arguments.Count - 1)]
            }
            $stdout = Join-Path $diagnostics ($name + '.stdout.log')
            $stderr = Join-Path $diagnostics ($name + '.stderr.log')
            $started = (Get-Date).ToUniversalTime().ToString('o')
            @{ name=$name; arguments=$arguments; started_at=$started; status='running'; python_exit_code=$null } |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $diagnostics ($name + '.json')) -Encoding utf8
            Write-Host ('MOTION_PROCESS_START ' + $name)
            & python -X faulthandler -u @arguments 1> $stdout 2> $stderr
            $nativeExit = $LASTEXITCODE
            @{ name=$name; arguments=$arguments; started_at=$started; completed_at=(Get-Date).ToUniversalTime().ToString('o'); status='completed'; python_exit_code=$nativeExit } |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $diagnostics ($name + '.json')) -Encoding utf8
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
            Write-Host ('MOTION_PROCESS_EXIT ' + $name + ' ' + $nativeExit)
            if ($nativeExit -ne 0) { exit $nativeExit }
          }
          Invoke-MotionCheck 'download-terminal' @('-m', 'unittest', 'test_download_terminal_v1824', '-v')
          Invoke-MotionCheck 'clipboard-reenable' @('-m', 'unittest', 'test_clipboard_reenable_v1825', '-v')
          Invoke-MotionCheck 'cleanroom-native-worker' @('-m', 'unittest', 'test_win_clipboard_io_v1825', 'test_clipboard_read_purpose_v1825', 'test_clipboard_references_v1825', 'test_explicit_file_paste_v1825', 'test_transfer_interaction_v1823', 'test_win_clipboard_cache_v1825', 'test_clipboard_native_read_v1825', 'test_clipboard_worker_outcomes_v1825', 'test_clipboard_reader_entry_v1825', 'test_clipboard_cleanup_v1825', 'test_clipboard_cleanup_entry_v1825', 'test_clipboard_audit_source_v1825', 'test_clipboard_local_original_v1825', 'test_native_text_budget_v1825', 'test_native_text_single_pass_v1825', 'test_native_text_views_v1825', 'test_native_text_stream_v1825', 'test_clipboard_presenter_lifecycle_v1825', '-v')
          Invoke-MotionCheck 'bootstrap-and-stage-ownership' @('-m', 'unittest', 'test_clipboard_empty_bootstrap_v1825', 'test_clipboard_empty_receive_v1825', 'test_clipboard_private_baseline_v1825', 'test_native_read_retry_v1825', 'test_native_image_fidelity_v1825', 'test_shelf_stage_store_v1825.CanonicalStageTests', 'test_shelf_payload_gate_v1825', '-v')
          Invoke-MotionCheck 'cleanroom-popup-lifecycle' @('-m', 'unittest', 'test_popup_subscription_v1825', 'test_clipboard_popup_native_events_v1825', 'test_modal_owner_lifecycle_v1825', 'test_secondary_window_handoff_v1825', 'test_chrome_event_scope_v1825', 'test_morph_text_scale_v1825', 'test_card_style_ownership_v1825', '-v')
          Invoke-MotionCheck 'shelf-control-transport' @('-m', 'unittest', 'test_shelf_control_transport_v1825', '-v')
          Invoke-MotionCheck 'clipboard-size-and-multipart' @('-m', 'unittest', 'test_clipboard_size_contract_v1825', 'test_clipboard_multipart_v1825', '-v')
          Invoke-MotionCheck 'motion-components' @('-m', 'unittest', 'test_ui_followup_v1823', 'test_cached_surface_v1823', 'test_stack_spread_v1823', 'test_input_motion_v1823', 'test_content_entrance_v1823', 'test_transfer_drop_feedback_v1823', 'test_transfer_item_motion_v1823', 'test_popup_motion_v1823', 'test_drop_target_motion_v1823', 'test_morph_snapshot_content_v1824', '-v')
          Invoke-MotionCheck 'motion-notices-permissions' @('-m', 'unittest', 'test_clipboard_notice_motion_v1823', 'test_clipboard_popup_motion_v1823', 'test_mac_status_drop_v1823', 'test_mac_permissions_v1821', 'test_presentation_v1819.PresentationTests', '-v')
          Invoke-MotionCheck 'surface-continuity' @('test_surface_continuity_v162.py')
      - name: Reproduce asynchronous metadata reconciliation before framework warmup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python -X faulthandler qt_unittest.py test_motion_resources_v1822.DisplayMetadataTests -v
          QT_QPA_PLATFORM=offscreen python -X faulthandler qt_unittest.py test_stability_v1822 test_resources_v1822.ResourceTests test_motion_resources_v1822.MotionTests test_motion_resources_v1822.DisplayMetadataTests test_motion_resources_v1822.MacVolumeTests test_receive_lifecycle_v1822.ReceiveLifecycleTests test_transfer_entry_v1822.EntryTests test_small_upload_lane.SmallLaneTests -v
      - name: Inspect native volume metadata on the disposable Mac filesystem
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import json, tempfile, os, objc
          from pathlib import Path
          from Foundation import NSURL, NSURLVolumeIsLocalKey, NSURLVolumeURLKey
          from file_metadata import _local_volume
          with tempfile.TemporaryDirectory(prefix='flickdock-volume-probe-') as directory:
              parent=Path(directory).resolve(strict=True)
              print(json.dumps({'python_volume_flag':getattr(os,'ST_LOCAL',None),'objc_version':getattr(objc,'__version__',None),'classifier':_local_volume(str(parent/'missing.bin'))}))
              with objc.autorelease_pool():
                  url=NSURL.fileURLWithPath_(str(parent))
                  for label,query in (
                      ('single',lambda:url.getResourceValue_forKey_error_(None,NSURLVolumeIsLocalKey,None)),
                      ('dictionary',lambda:url.resourceValuesForKeys_error_([NSURLVolumeIsLocalKey,NSURLVolumeURLKey],None))):
                      try: print(label,repr(query()))
                      except Exception as error: print(label,type(error).__name__,str(error))
          PY
      - name: Install locked local cloud test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual OS copy and paste through the production cloud client
        shell: pwsh
        run: |
          $env:FD_QA_PYTHON = (Get-Command python).Source
          node cloud/test/clipboard.mjs
      - name: Verify actual native utility windows on the disposable runner
        run: python ci_utility_windows.py --output native-utility.json
      - name: Verify native Cocoa status item menu and local-file destination methods
        if: runner.os == 'macOS'
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'ci_mac_status_drop.py','native-status-drop.json'],check=True,timeout=25)"
      - name: Ensure native installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify actual installer shutdown and replacement
        if: runner.os == 'Windows'
        run: python ci_installer_close.py --output native-installer-close.json
      - name: Retain native window verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-utility-${{ matrix.runner }}-${{ github.sha }}
          path: |
            clipboard-origin-native.json
            clipboard-origin-native.trace.jsonl
            transfer-navigation-native.json
            native-utility.json
            native-installer-close.json
            native-status-drop.json
            build/native-motion-diagnostics/
          retention-days: 3

  frozen-normal-entry:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.normal_frozen != 'false'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install reviewed runtime and isolated external QA driver
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pywinauto==0.6.9 mss==10.1.0 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix cloud --no-audit --no-fund
      - name: Check explicit reviewed source manifest
        run: |
          python -m unittest discover -s qa/packaged-live -p test_native_reader_observation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa/packaged-live -p test_native_image_observation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa/packaged-live -p test_image_observation_handoff.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa/packaged-live -p test_uia_window_phases.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa/packaged-live -p test_diagnostic_journal.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa/packaged-live -p test_reader_observation_handoff.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s qa/packaged-live -p test_harness_bounds.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest test_windows_shell_bundle_v1824 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --before-build
      - name: Verify hosted real protected-helper Job and forced parent exit
        shell: pwsh
        run: |
          python -m unittest discover -s qa/packaged-live -p test_native_reader_job_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtureNonce = [Guid]::NewGuid().ToString('N')
          $fixtureProfile = Join-Path $env:RUNNER_TEMP ('flickdock-reader-job-' + $fixtureNonce)
          $fixtureExit = 1
          try {
            python qa/packaged-live/native_reader_job_gate.py --profile $fixtureProfile --nonce $fixtureNonce
            $fixtureExit = $LASTEXITCODE
          } finally {
            New-Item -ItemType Directory -Force -Path build/native-reader-job | Out-Null
            foreach ($fixtureName in @('report.json', 'parent-ready.json', 'parent-error.json')) {
              $fixtureEvidence = Join-Path $fixtureProfile $fixtureName
              if (Test-Path -LiteralPath $fixtureEvidence) {
                Copy-Item -LiteralPath $fixtureEvidence -Destination (Join-Path 'build/native-reader-job' $fixtureName)
              }
            }
          }
          if ($fixtureExit -ne 0) { exit $fixtureExit }
      - name: Build actual native executable with the production entry
        if: github.event.inputs.reuse_normal_run == ''
        run: |
          python ci_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python p2p_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean FlickDock.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --after-build
      - name: Reuse and verify immutable normal executable for QA-only changes
        if: github.event.inputs.reuse_normal_run != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_NORMAL_RUN: ${{ inputs.reuse_normal_run }}
        run: |
          python qa/packaged-live/reuse_frozen.py --run $env:REUSE_NORMAL_RUN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --after-build
      - name: Actual frozen private cleanup entry and original-byte protection
        shell: pwsh
        timeout-minutes: 3
        run: |
          New-Item -ItemType Directory -Force -Path build/cleanup-frozen | Out-Null
          $cleanupExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $cleanupHash = (Get-FileHash -LiteralPath $cleanupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $cleanupNonce = [Guid]::NewGuid().ToString('N')
          python qa/hosted_cleanup_gate.py --hosted-cleanup --nonce $cleanupNonce --repo $PWD --exe $cleanupExe --exe-sha256 $cleanupHash *> build/cleanup-frozen/report.jsonl
          $cleanupExit = $LASTEXITCODE
          Get-Content -LiteralPath build/cleanup-frozen/report.jsonl
          if ($cleanupExit -ne 0) { exit $cleanupExit }
      - name: Normal frozen process, external native Copy/Paste, policy switches and actual screen frames
        shell: pwsh
        env:
          NORMAL_ACTIONS_SCOPE: ${{ github.event.inputs.normal_actions_scope }}
        run: |
          $nativeExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $nativeHash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:NORMAL_ACTIONS_SCOPE -eq 'core') {
            python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa
          } elseif ($env:NORMAL_ACTIONS_SCOPE -eq 'tray-observation') {
            python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --actions qa/packaged-live/ui-tray-observation.json
          } elseif ($env:NORMAL_ACTIONS_SCOPE -eq 'recent-observation') {
            python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --actions qa/packaged-live/ui-recent-observation.json
          } elseif ($env:NORMAL_ACTIONS_SCOPE -eq 'writer-observation') {
            python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --writer-observation
          } elseif ($env:NORMAL_ACTIONS_SCOPE -eq 'receive-first-observation') {
            python -m unittest discover -s qa/packaged-live -p test_receive_first_gate.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --receive-first
          } else {
            python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --actions qa/packaged-live/ui-actions.json --extra-actions qa/packaged-live/ui-extra-actions.json --batch2-actions qa/packaged-live/ui-batch2-actions.json --supplement-actions qa/packaged-live/ui-supplement-actions.json
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure native installer compiler for same-byte validation
        if: github.event.inputs.installer_acceptance == 'true' && (github.event.inputs.normal_actions_scope == 'full' || github.event.inputs.normal_actions_scope == 'core')
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify exact production installer with a real old process and relaunch
        if: github.event.inputs.installer_acceptance == 'true' && (github.event.inputs.normal_actions_scope == 'full' || github.event.inputs.normal_actions_scope == 'core')
        env:
          FD_QA_NATIVE: '1'
        shell: pwsh
        run: |
          $nativeExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $nativeHash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          python qa/packaged-live/ci_exact_installer.py --root $PWD --exe $nativeExe --sha256 $nativeHash --normal-report build/normal-native-qa/normal-frozen-native-report.json --output build/exact-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve actual QA pixels and exact tested executable and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: normal-frozen-windows-${{ github.sha }}
          path: |
            build/normal-native-qa/
            build/native-reader-job/
            build/cleanup-frozen/
            build/normal-source-verification.json
            build/reused-frozen-receipt.json
            build/exact-installer/
            package-audit-analysis.json
            dist/FlickDock/
          if-no-files-found: error
          retention-days: 3
