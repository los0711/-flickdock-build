name: Native clipboard verification

on:
  workflow_dispatch:
    inputs:
      cross_device:
        description: Run separate Windows and Apple-silicon peers in all three pairings
        type: boolean
        default: false
      upload_profile:
        description: Diagnose actual Qt upload progress versus cloud confirmation
        type: boolean
        default: false
      vpn_profile:
        description: Use the private QA node as the native system HTTP proxy
        type: boolean
        default: false
      vpn_mode:
        description: System-proxy states for the separate peer tests
        type: choice
        options: [none, a, b, both]
        default: none
      kernel_only:
        description: Isolate original-kernel connectivity without repeating cloud file traffic
        type: boolean
        default: false
      manual_route:
        description: Required route for isolated original-kernel verification
        type: choice
        options: [direct, relay-udp, relay-tls]
        default: direct
      cloud_only:
        description: Verify automatic native clipboard and shelf sync without manual transport
        type: boolean
        default: false
  push:
    branches: [cloud-build]

permissions:
  contents: read

jobs:
  cloud-contract:
    if: github.repository == 'los0711/-flickdock-build' && inputs.cross_device != true && inputs.upload_profile != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install locked local service test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual workerd, D1, R2 and signaling contracts
        run: |
          npm run typecheck --prefix cloud
          npm test --prefix cloud
  clipboard:
    if: github.repository == 'los0711/-flickdock-build' && inputs.cross_device != true && inputs.upload_profile != true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the reviewed Qt runtime
        run: python -m pip install PySide6==6.12.0 'yt-dlp[default]==2026.10.26'
      - name: Install native macOS pasteboard bindings
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Verify interrupted receive, native file identity and proxy validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_sync_scheduler test_cloud_events_v1825 test_clipboard_sync_v1819 test_clipboard_history_v1823 test_transfer_entry_v1822 test_video_matrix -q
      - name: Reproduce asynchronous metadata reconciliation before framework warmup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest test_motion_resources_v1822.DisplayMetadataTests -v
          QT_QPA_PLATFORM=offscreen python -m unittest test_stability_v1822 test_resources_v1822.ResourceTests test_motion_resources_v1822.MotionTests test_motion_resources_v1822.DisplayMetadataTests test_motion_resources_v1822.MacVolumeTests test_receive_lifecycle_v1822.ReceiveLifecycleTests test_transfer_entry_v1822.EntryTests test_small_upload_lane.SmallLaneTests -q
      - name: Inspect native volume metadata on the disposable Mac filesystem
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import json, tempfile, os, objc
          from pathlib import Path
          from Foundation import NSURL, NSURLVolumeIsLocalKey, NSURLVolumeURLKey
          from file_metadata import _local_volume
          with tempfile.TemporaryDirectory(prefix='flickdock-volume-probe-') as directory:
              parent=Path(directory).resolve(strict=True)
              print(json.dumps({'python_volume_flag':getattr(os,'ST_LOCAL',None),'objc_version':getattr(objc,'__version__',None),'classifier':_local_volume(str(parent/'missing.bin'))}))
              with objc.autorelease_pool():
                  url=NSURL.fileURLWithPath_(str(parent))
                  for label,query in (
                      ('single',lambda:url.getResourceValue_forKey_error_(None,NSURLVolumeIsLocalKey,None)),
                      ('dictionary',lambda:url.resourceValuesForKeys_error_([NSURLVolumeIsLocalKey,NSURLVolumeURLKey],None))):
                      try: print(label,repr(query()))
                      except Exception as error: print(label,type(error).__name__,str(error))
          PY
      - name: Install locked local cloud test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual OS copy and paste through the production cloud client
        shell: pwsh
        run: |
          $env:FD_QA_PYTHON = (Get-Command python).Source
          node cloud/test/clipboard.mjs
      - name: Verify actual native utility windows on the disposable runner
        run: python ci_utility_windows.py --output native-utility.json
      - name: Ensure native installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify actual installer shutdown and replacement
        if: runner.os == 'Windows'
        run: python ci_installer_close.py --output native-installer-close.json
      - name: Retain native window verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-utility-${{ matrix.runner }}-${{ github.sha }}
          path: |
            native-utility.json
            native-installer-close.json
          retention-days: 3
  upload-profile:
    if: github.repository == 'los0711/-flickdock-build' && inputs.upload_profile == true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.12.0 keyring==25.7.0 cryptography==50.0.2
      - name: Compare original native Qt file and sliced file uploads
        if: inputs.vpn_profile != true
        env:
          FLICKDOCK_QA_SYNC_JSON: ${{ secrets.FLICKDOCK_QA_DUAL_NATIVE }}
        run: python ci_upload_profile.py
      - name: Download and verify the original isolated proxy core before enabling it
        if: inputs.vpn_profile == true
        run: python ci_vpn.py prepare
      - name: Profile real cloud traffic through the private node and native system proxy
        if: inputs.vpn_profile == true
        env:
          FLICKDOCK_QA_SYNC_JSON: ${{ secrets.FLICKDOCK_QA_DUAL_NATIVE }}
          FLICKDOCK_QA_VPN_NODE: ${{ secrets.FLICKDOCK_QA_VPN_NODE }}
        run: python ci_vpn.py run -- python ci_upload_profile.py
      - name: Retain sanitized transfer timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upload-profile-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flickdock-upload-profile.json
            ${{ runner.temp }}/flickdock-vpn/proxy-report.json
          retention-days: 3
  cross-device:
    if: github.repository == 'los0711/-flickdock-build' && inputs.cross_device == true
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pair: win-mac, side: a, runner: windows-latest}
          - {pair: win-mac, side: b, runner: macos-15}
          - {pair: win-win, side: a, runner: windows-latest}
          - {pair: win-win, side: b, runner: windows-latest}
          - {pair: mac-mac, side: a, runner: macos-15}
          - {pair: mac-mac, side: b, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FD_QA_PAIR: ${{ matrix.pair }}
      FD_QA_SIDE: ${{ matrix.side }}
      FD_QA_VPN_MODE: ${{ inputs.vpn_mode || 'none' }}
      FD_QA_KERNEL_ONLY: ${{ inputs.kernel_only && 'true' || 'false' }}
      FD_QA_MANUAL_ROUTE: ${{ inputs.manual_route || 'direct' }}
      FD_QA_CLOUD_ONLY: ${{ inputs.cloud_only && 'true' || 'false' }}
      FD_QA_ICE_TRACE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the existing production Qt and account dependencies
        run: python -m pip install PySide6==6.12.0 keyring==25.7.0 cryptography==50.0.2
      - name: Install native Apple pasteboard bindings
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Prepare the original native WebRTC runtime
        if: inputs.cloud_only != true
        shell: pwsh
        run: |
          $env:FLICKDOCK_BUILD_CACHE = Join-Path $env:RUNNER_TEMP 'flickdock-cache'
          python p2p_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify finite original-engine jobs on the native operating system
        if: inputs.cloud_only != true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          npm ci --prefix cloud --no-audit --no-fund
          python -m unittest test_original_transfer test_wan_transfer_v1816 -q
      - name: Prepare the verified proxy core before enabling the private node
        if: inputs.vpn_mode == 'both' || inputs.vpn_mode == matrix.side
        run: python ci_vpn.py prepare
      - name: Allow original kernel TCP and UDP on disposable Windows runner
        if: runner.os == 'Windows' && inputs.cloud_only != true
        shell: pwsh
        run: |
          $binary=(Resolve-Path 'p2p/runtime/node.exe').Path
          $prefix="FlickDock-QA-$env:GITHUB_RUN_ID-$env:FD_QA_PAIR-$env:FD_QA_SIDE"
          foreach($protocol in @('TCP','UDP')) {
            foreach($direction in @('Inbound','Outbound')) {
              New-NetFirewallRule -Name "$prefix-$protocol-$direction" -DisplayName "$prefix-$protocol-$direction" -Program $binary -Protocol $protocol -Direction $direction -Action Allow -Profile Any | Out-Null
            }
          }
          if (@(Get-NetFirewallRule -Name "$prefix-*").Count -ne 4) { throw 'Original kernel firewall rules were not installed' }
          'FD_QA_NATIVE_FIREWALL=true' >> $env:GITHUB_ENV
      - name: Prepare private sessions and public synthetic fixture metadata
        shell: pwsh
        env:
          FLICKDOCK_QA_SYNC_JSON: ${{ secrets.FLICKDOCK_QA_DUAL_NATIVE }}
          GITHUB_TOKEN: ${{ github.token }}
          FLICKDOCK_QA_VPN_NODE: ${{ secrets.FLICKDOCK_QA_VPN_NODE }}
        run: |
          if ($env:FD_QA_VPN_MODE -eq 'both' -or $env:FD_QA_VPN_MODE -eq $env:FD_QA_SIDE) {
            python ci_vpn.py run -- python ci_cross_device.py bootstrap --root (Join-Path $env:RUNNER_TEMP 'flickdock-dual-native')
          } else {
            Remove-Item Env:FLICKDOCK_QA_VPN_NODE -ErrorAction SilentlyContinue
            python ci_cross_device.py bootstrap --root (Join-Path $env:RUNNER_TEMP 'flickdock-dual-native')
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exchange public device identities with the other runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-bootstrap-${{ matrix.pair }}-${{ matrix.side }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flickdock-dual-native/public.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify both directions of native clipboard, shelf and original WebRTC transfers
        shell: pwsh
        env:
          FLICKDOCK_QA_SYNC_JSON: ${{ secrets.FLICKDOCK_QA_DUAL_NATIVE }}
          GITHUB_TOKEN: ${{ github.token }}
          FLICKDOCK_QA_VPN_NODE: ${{ secrets.FLICKDOCK_QA_VPN_NODE }}
        run: |
          if ($env:FD_QA_VPN_MODE -eq 'both' -or $env:FD_QA_VPN_MODE -eq $env:FD_QA_SIDE) {
            python ci_vpn.py run -- python ci_cross_device.py run --root (Join-Path $env:RUNNER_TEMP 'flickdock-dual-native')
          } else {
            Remove-Item Env:FLICKDOCK_QA_VPN_NODE -ErrorAction SilentlyContinue
            python ci_cross_device.py run --root (Join-Path $env:RUNNER_TEMP 'flickdock-dual-native')
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only sanitized verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-results-${{ matrix.pair }}-${{ matrix.side }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flickdock-dual-native/report.json
            ${{ runner.temp }}/flickdock-vpn/proxy-report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Remove only this disposable Windows peer's firewall rules
        if: always() && runner.os == 'Windows' && inputs.cloud_only != true
        shell: pwsh
        run: |
          $prefix="FlickDock-QA-$env:GITHUB_RUN_ID-$env:FD_QA_PAIR-$env:FD_QA_SIDE"
          Get-NetFirewallRule -Name "$prefix-*" -ErrorAction SilentlyContinue | Remove-NetFirewallRule
