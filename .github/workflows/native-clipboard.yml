name: Independent clipped Windows material probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-material:
    if: github.repository == 'los0711/-flickdock-build'
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the reviewed Qt probe runtime
        run: python -m pip install PySide6==6.12.0
      - name: Compile the isolated DLL using installed Windows SDK and MSVC only
        run: python build_windows_material_probe.py --output-dir material-native
      - name: Measure real clipped blur, foreground pixels and empty host gutters
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'ci_windows_material_probe.py','--build-json','material-native/build.json','--output','material-native/pixels.json'],check=True,timeout=60)"
      - name: Retain positive or negative native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-native-${{ github.sha }}
          path: material-native/*
          if-no-files-found: error
          retention-days: 3
