name: Native clipboard verification

on:
  workflow_dispatch:
    inputs:
      intel_motion_diagnostic:
        description: Run unchanged Intel ordered 117-test crash diagnostic only
        type: boolean
        default: false
      native_checks:
        description: Run platform checks, disable only when identical runtime and maintained tests were already checked
        type: boolean
        default: true
      cloud_contract:
        description: Re-run unchanged service contracts
        type: boolean
        default: true
      normal_frozen:
        description: Build and verify normal frozen Windows executable
        type: boolean
        default: true
      reuse_normal_run:
        description: Existing exact-source normal dist artifact run, optional
        type: string
        default: ''
      reveal_probe:
        description: Run the isolated Windows Shell selection diagnostic
        type: boolean
        default: false
  push:
    branches: [cloud-build]

permissions:
  contents: read
  actions: read

jobs:
  intel-ordered-117:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.intel_motion_diagnostic == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FD_DIAGNOSTIC_MODE: baseline
      FD_DIAGNOSTIC_COLLECT: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install the original Intel source-test dependencies without rebuilding the app
        run: |
          python -m venv build/macos-venv
          build/macos-venv/bin/python -m pip install 'PySide6==6.12.0' 'PyInstaller==6.22.3' 'keyring==25.7.0' 'pyobjc-core==13.0' 'pyobjc-framework-Cocoa==13.0' 'pyobjc-framework-Quartz==12.2.2' 'cffi==2.1.1' 'pycparser==3.12'
          OPENSSL_STATIC=1 build/macos-venv/bin/python -m pip install --force-reinstall --no-cache-dir --no-binary=cryptography 'cryptography==50.0.2'
          build/macos-venv/bin/python -m pip freeze > build/intel-motion-pip-freeze.txt
          python ci_assets.py
      - name: Run the unchanged ordered 117-test process with crash diagnostics
        run: |
          args=()
          if [ "$FD_DIAGNOSTIC_COLLECT" = "true" ]; then args+=(--collect-after-test); fi
          build/macos-venv/bin/python -X faulthandler -u qa/macos_motion_diagnostic_v1824.py --mode "$FD_DIAGNOSTIC_MODE" --output build/intel-motion-diagnostic "${args[@]}"
      - name: Preserve actual failure, environment, order and exact-PID crash reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-motion-baseline-${{ github.sha }}
          path: |
            build/intel-motion-diagnostic/
            build/intel-motion-pip-freeze.txt
          if-no-files-found: error
          retention-days: 3

  reveal-probe:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.reveal_probe == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install read-only Shell observation binding
        run: python -m pip install pywin32==311
      - name: Observe actual Shell selection with official API variants
        run: python qa/packaged-live/ci_windows_reveal_probe.py --output build/windows-reveal-probe
      - name: Preserve real Shell results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-reveal-probe-${{ github.sha }}
          path: build/windows-reveal-probe/
          if-no-files-found: error
          retention-days: 3

  cloud-contract:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.cloud_contract != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install locked local service test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual workerd, D1, R2 and signaling contracts
        run: |
          npm run typecheck --prefix cloud
          npm test --prefix cloud
  clipboard:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.native_checks != 'false'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the reviewed Qt runtime
        run: python -m pip install PySide6==6.12.0
      - name: Install native macOS pasteboard bindings
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Check clipboard source ownership and real external editor Copy
        run: python ci_clipboard_origin.py --output clipboard-origin-native.json
      - name: Observe actual native transfer-to-overview handoff
        run: python ci_transfer_navigation.py
      - name: Check delayed formats, input fields and shared upload regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_clipboard_origin_v1823 test_clipboard_loop_v1824 test_sync_switch_lifecycle_v1824 test_transfer_interaction_v1823 test_clipboard_sync_v1819 test_clipboard_fast_v1821 test_shared_clipboard_files_v1821 test_pointer_paste_v1819 -q
      - name: Verify independent updater handoff regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_update_inline_v171 -q
      - name: Verify current platform file-manager and functional layout contracts before full builds
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_ui_polish_v1823 test_functional_layout_v1823 test_update_exit_v1823 test_update_macos_controller -q
      - name: Verify frame lifecycle, popup and real control-state paint regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_windows_reveal_v1824 test_transfer_balance_v1824 test_item_reflow_occlusion_v1824 test_native_owner_lifetime_v1824 test_frame_animation_v1824 test_screen_animation_timer_v1824 test_user_popup_fixes_v1823 test_standard_control_states_v1824 test_disabled_field_states_v1824 -q
      - name: Verify all motion paths with explicit ordinary and reduced-motion prerequisites
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest test_ui_followup_v1823 test_cached_surface_v1823 test_stack_spread_v1823 test_input_motion_v1823 test_content_entrance_v1823 test_transfer_drop_feedback_v1823 test_transfer_item_motion_v1823 test_popup_motion_v1823 test_drop_target_motion_v1823 -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest test_clipboard_notice_motion_v1823 test_clipboard_popup_motion_v1823 test_mac_status_drop_v1823 test_mac_permissions_v1821 test_presentation_v1819.PresentationTests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_surface_continuity_v162.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce asynchronous metadata reconciliation before framework warmup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest test_motion_resources_v1822.DisplayMetadataTests -v
          QT_QPA_PLATFORM=offscreen python -m unittest test_stability_v1822 test_resources_v1822.ResourceTests test_motion_resources_v1822.MotionTests test_motion_resources_v1822.DisplayMetadataTests test_motion_resources_v1822.MacVolumeTests test_receive_lifecycle_v1822.ReceiveLifecycleTests test_transfer_entry_v1822.EntryTests test_small_upload_lane.SmallLaneTests -q
      - name: Inspect native volume metadata on the disposable Mac filesystem
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import json, tempfile, os, objc
          from pathlib import Path
          from Foundation import NSURL, NSURLVolumeIsLocalKey, NSURLVolumeURLKey
          from file_metadata import _local_volume
          with tempfile.TemporaryDirectory(prefix='flickdock-volume-probe-') as directory:
              parent=Path(directory).resolve(strict=True)
              print(json.dumps({'python_volume_flag':getattr(os,'ST_LOCAL',None),'objc_version':getattr(objc,'__version__',None),'classifier':_local_volume(str(parent/'missing.bin'))}))
              with objc.autorelease_pool():
                  url=NSURL.fileURLWithPath_(str(parent))
                  for label,query in (
                      ('single',lambda:url.getResourceValue_forKey_error_(None,NSURLVolumeIsLocalKey,None)),
                      ('dictionary',lambda:url.resourceValuesForKeys_error_([NSURLVolumeIsLocalKey,NSURLVolumeURLKey],None))):
                      try: print(label,repr(query()))
                      except Exception as error: print(label,type(error).__name__,str(error))
          PY
      - name: Install locked local cloud test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual OS copy and paste through the production cloud client
        shell: pwsh
        run: |
          $env:FD_QA_PYTHON = (Get-Command python).Source
          node cloud/test/clipboard.mjs
      - name: Verify actual native utility windows on the disposable runner
        run: python ci_utility_windows.py --output native-utility.json
      - name: Verify native Cocoa status item menu and local-file destination methods
        if: runner.os == 'macOS'
        run: python -c "import subprocess,sys; subprocess.run([sys.executable,'ci_mac_status_drop.py','native-status-drop.json'],check=True,timeout=25)"
      - name: Ensure native installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify actual installer shutdown and replacement
        if: runner.os == 'Windows'
        run: python ci_installer_close.py --output native-installer-close.json
      - name: Retain native window verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-utility-${{ matrix.runner }}-${{ github.sha }}
          path: |
            clipboard-origin-native.json
            clipboard-origin-native.trace.jsonl
            transfer-navigation-native.json
            native-utility.json
            native-installer-close.json
            native-status-drop.json
          retention-days: 3

  frozen-normal-entry:
    if: github.repository == 'los0711/-flickdock-build' && github.event.inputs.normal_frozen != 'false'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install reviewed runtime and isolated external QA driver
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pywinauto==0.6.9 mss==10.1.0 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix cloud --no-audit --no-fund
      - name: Check explicit reviewed source manifest
        run: |
          python -m unittest discover -s qa/packaged-live -p test_harness_bounds.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest test_windows_shell_bundle_v1824 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --before-build
      - name: Build actual native executable with the production entry
        if: github.event.inputs.reuse_normal_run == ''
        run: |
          python ci_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python p2p_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean FlickDock.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --after-build
      - name: Reuse and verify immutable normal executable for QA-only changes
        if: github.event.inputs.reuse_normal_run != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_NORMAL_RUN: ${{ inputs.reuse_normal_run }}
        run: |
          python qa/packaged-live/reuse_frozen.py --run $env:REUSE_NORMAL_RUN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/packaged-live/verify_frozen_source.py --after-build
      - name: Normal frozen process, external native Copy/Paste, policy switches and actual screen frames
        shell: pwsh
        run: |
          $nativeExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $nativeHash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          python qa/packaged-live/ci_packaged_windows_live.py --exe $nativeExe --sha256 $nativeHash --root $PWD --output build/normal-native-qa --actions qa/packaged-live/ui-actions.json --extra-actions qa/packaged-live/ui-extra-actions.json --batch2-actions qa/packaged-live/ui-batch2-actions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure native installer compiler for same-byte validation
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify exact production installer with a real old process and relaunch
        env:
          FD_QA_NATIVE: '1'
        shell: pwsh
        run: |
          $nativeExe = (Resolve-Path 'dist/FlickDock/FlickDock.exe').Path
          $nativeHash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          python qa/packaged-live/ci_exact_installer.py --root $PWD --exe $nativeExe --sha256 $nativeHash --normal-report build/normal-native-qa/normal-frozen-native-report.json --output build/exact-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve actual QA pixels and exact tested executable and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: normal-frozen-windows-${{ github.sha }}
          path: |
            build/normal-native-qa/
            build/normal-source-verification.json
            build/reused-frozen-receipt.json
            build/exact-installer/
            package-audit-analysis.json
            dist/FlickDock/
          if-no-files-found: error
          retention-days: 3
