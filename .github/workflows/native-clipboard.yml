name: Native clipboard verification

on:
  workflow_dispatch:
  push:
    branches: [cloud-build]

permissions:
  contents: read

jobs:
  clipboard:
    if: github.repository == 'los0711/-flickdock-build'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      FD_QA_NATIVE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the reviewed Qt runtime
        run: python -m pip install PySide6==6.12.0
      - name: Install native macOS pasteboard bindings
        if: runner.os == 'macOS'
        run: python -m pip install 'pyobjc-framework-Quartz>=11,<13'
      - name: Install locked local cloud test dependencies
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Verify actual OS copy and paste through the production cloud client
        shell: pwsh
        run: |
          $env:FD_QA_PYTHON = (Get-Command python).Source
          node cloud/test/clipboard.mjs
      - name: Diagnose actual native macOS public update download
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,tempfile,time
          from PySide6.QtCore import QCoreApplication,QTimer
          from update_client import UpdateClient
          app=QCoreApplication([]);result={};started=time.monotonic()
          with tempfile.TemporaryDirectory(prefix='flickdock-public-update-diagnostic-') as profile:
              client=UpdateClient('1.8.14',Path(profile),timeout_ms=60000)
              def finish(error=''):
                  result.update(ok=not error,error=error,seconds=round(time.monotonic()-started,2))
                  print('NATIVE PUBLIC UPDATE:',json.dumps(result,ensure_ascii=False),flush=True)
                  client.close();app.exit(1 if error else 0)
              def available(manifest,manual):
                  result['version']=manifest['version'];result['installer']=manifest['installer']
                  client.download(manifest,manual=True)
              client.update_available.connect(available)
              client.verified_file.connect(lambda path,manifest,manual:finish())
              client.failed.connect(lambda error,manual:finish(error))
              client.download_status.connect(lambda state,detail:result.update(last_state=state))
              QTimer.singleShot(0,lambda:client.check(manual=True))
              QTimer.singleShot(180000,lambda:finish('diagnostic deadline'))
              status=app.exec()
          raise SystemExit(status)
          PY
      - name: Verify actual native utility windows on the disposable runner
        run: python ci_utility_windows.py --output native-utility.json
      - name: Retain native window verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-utility-${{ matrix.runner }}-${{ github.sha }}
          path: native-utility.json
          retention-days: 3
