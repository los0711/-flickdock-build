name: Verify released Mac update
on:
  push:
    branches: [mac-public-update-verify-20261116]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Download installed app and verify its released update
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/flickdock-check"
          mkdir -p "$folder/mount"
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            -o "$folder/application.dmg" \
            'https://flickdock-site.roger000416.workers.dev/downloads/FlickDock-1.8.37-macOS-arm64.dmg'
          echo "10e721518b348906ead7ca7455bb6462fe508363941e51e81351b6fe8dd15541  $folder/application.dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint "$folder/mount" "$folder/application.dmg"
          trap 'hdiutil detach "$folder/mount" >/dev/null 2>&1 || true' EXIT
          ditto "$folder/mount/FlickDock.app" "$folder/FlickDock.app"
          hdiutil detach "$folder/mount"
          trap - EXIT
          export QT_QPA_PLATFORM=offscreen
          export TMPDIR="$folder"
          "$folder/FlickDock.app/Contents/MacOS/FlickDock" \
            --verify-update --verify-current 1.8.36 --verify-output "$folder/update.json"
          python3 -c "import json,os; from pathlib import Path; d=json.loads((Path(os.environ['TMPDIR'])/'update.json').read_text()); assert d['ok'] and d['frozen'] and d['verified_download'] and not d['installer_executed'] and d['latest_version']=='1.8.37' and d['download_sha256']=='67fb82385a2c97b57bec5cc2f0c1d82cbc01efcbc372d4bb991a2cd407bed8b1',d; print('Verified public Mac update end-to-end:', d['latest_version'])"
